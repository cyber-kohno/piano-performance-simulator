<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClavierDesk — Starting</title>
    <style>
      html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#293b43; color:#f7f3e7; font-family:'Segoe UI',sans-serif; }
      body { display:grid; place-items:center; user-select:none; }
      main { display:grid; justify-items:center; gap:12px; }
      img { width:76px; height:76px; }
      h1 { margin:0; font-size:24px; font-weight:600; letter-spacing:.2px; }
      p { margin:0; color:#bccdce; font-size:12px; }
      .progress { width:120px; height:2px; margin-top:5px; background:#51656b; overflow:hidden; }
      .progress::after { content:''; display:block; width:40%; height:100%; background:#77bfb3; animation:loading 1.1s ease-in-out infinite; }
      @keyframes loading { from { transform:translateX(-100%); } to { transform:translateX(350%); } }
      @media (prefers-reduced-motion:reduce) { .progress::after { animation:none; transform:translateX(75%); } }
    </style>
  </head>
  <body>
    <main aria-label="ClavierDesk is starting">
      <img src="./icon.svg" alt="" />
      <h1>ClavierDesk</h1>
      <p role="status">Loading piano sound…</p>
      <div class="progress" role="progressbar" aria-label="Loading piano sound"></div>
    </main>
  </body>
</html>
